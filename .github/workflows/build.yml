name: Build ScreenControl

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      number: ${{ steps.version.outputs.number }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        name: Resolve build version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(python3 -c 'import plistlib; print(plistlib.load(open("packaging/Info.plist", "rb"))["CFBundleShortVersionString"])')"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a version in the form X.Y.Z"
            exit 1
          fi
          echo "number=$version" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS Apple Silicon
    needs: version
    runs-on: macos-15
    env:
      SCREENCONTROL_VERSION: ${{ needs.version.outputs.number }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build application
        run: ./packaging/build-mac.sh
      - name: Run Go tests
        run: go test ./...
      - name: Build DMG
        run: ./packaging/build-dmg.sh
      - uses: actions/upload-artifact@v6
        with:
          name: macos-arm64
          path: build/ScreenControl-${{ needs.version.outputs.number }}-macos-arm64.dmg
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: version
    runs-on: windows-2025
    env:
      SCREENCONTROL_VERSION: ${{ needs.version.outputs.number }}
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Run Go tests
        run: go test ./...
      - name: Build Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build -Force | Out-Null
          go build -trimpath -tags "desktop,production" -ldflags="-H windowsgui" -o "build/ScreenControl-${env:SCREENCONTROL_VERSION}-windows-x64.exe" .
      - uses: actions/upload-artifact@v6
        with:
          name: windows-x64
          path: build/ScreenControl-${{ needs.version.outputs.number }}-windows-x64.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true
      - name: Publish release with both installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes
          fi
